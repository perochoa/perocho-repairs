name: Worker checks

# Shared by ci.yml and deploy.yml so both run the same worker checks.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Set here because the jobs that call this workflow can't set a timeout themselves. In deploy.yml
  # this runs inside the queued deploy, so a hung step would otherwise hold later deploys for the
  # default six hours.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No step pushes, so the token needn't be kept in .git/config.
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check generated types are current
        run: npm run types -- --check

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test
