name: CI

# Checks only: no secrets and no deploy steps, so running on pull requests can't ship anything.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Several times what the job should need; it stops a hung step from running for the default six
  # hours.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No step pushes, so the token needn't be kept in .git/config.
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Build with Astro
        run: npm run build

  worker:
    permissions:
      contents: read
    # A job that calls a workflow can't set a timeout; worker-check.yml sets its own.
    uses: ./.github/workflows/worker-check.yml
